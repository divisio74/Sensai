<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sensai</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body class="empty">
    <header id="topbar">
        <div id="logo">SENSAI</div>
        <div id="tools">
            <button id="new-chat" class="ghost" type="button">New chat</button>
        </div>
    </header>

    <main id="chat"></main>

    <section id="welcome">
        <h2 id="greeting">Hello, I'm Sensai</h2>
        <p id="subtitle">Your local developer assistant</p>
    </section>

    <div id="composer">
        <form id="form">
            <input id="input" placeholder="Ask Sensai... (type /help for commands)" autocomplete="off">
            <button id="send" type="submit">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 19V5M5 12l7-7 7 7"/>
                </svg>
            </button>
        </form>

        <p id="disclaimer">Sensai runs locally with Ollama and can make mistakes.</p>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
